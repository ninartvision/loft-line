<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8">
  <script>document.documentElement.classList.add('js');</script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 – გვერდი არ მოიძებნა | Loft Line</title>
  <meta name="description" content="მოთხოვნილი გვერდი არ მოიძებნა. დაბრუნდით Loft Line-ის მთავარ გვერდზე.">
  <meta name="robots" content="noindex, follow">
  <meta name="theme-color" content="#0e0e0e">
  <link rel="icon" href="favicon.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="canonical" href="https://loftline.store/404.html">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600;700&family=Noto+Sans+Georgian:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0e0e0e;
      --surface: #161616;
      --border: rgba(255,255,255,0.08);
      --text: #f0ede8;
      --muted: rgba(240,237,232,0.5);
      --accent: #c8a96e;
      --font-serif: 'Playfair Display', serif;
      --font-sans: 'Inter', 'Noto Sans Georgian', sans-serif;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      -webkit-font-smoothing: antialiased;
    }

    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* ── Header ── */
    .err-header {
      padding: 24px 40px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
    }

    .err-logo {
      font-family: var(--font-serif);
      font-size: 22px;
      font-weight: 700;
      color: var(--text);
      text-decoration: none;
      letter-spacing: 0.04em;
    }

    /* ── Main content ── */
    .err-main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 80px 24px;
    }

    .err-code {
      font-family: var(--font-serif);
      font-size: clamp(80px, 18vw, 160px);
      font-weight: 700;
      line-height: 1;
      color: var(--accent);
      opacity: 0.18;
      user-select: none;
      letter-spacing: -0.04em;
    }

    .err-title {
      font-family: var(--font-serif);
      font-size: clamp(22px, 4vw, 36px);
      font-weight: 600;
      margin-top: -16px;
      margin-bottom: 16px;
      color: var(--text);
    }

    .err-desc {
      font-size: 15px;
      color: var(--muted);
      max-width: 440px;
      line-height: 1.65;
      margin-bottom: 40px;
    }

    .err-actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .err-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 13px 28px;
      border-radius: 2px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      text-decoration: none;
      transition: opacity 0.18s;
      cursor: pointer;
    }

    .err-btn:hover { opacity: 0.82; }
    .err-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

    .err-btn--primary {
      background: var(--accent);
      color: #0e0e0e;
      border: none;
    }

    .err-btn--ghost {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border);
    }

    /* ── Nav links ── */
    .err-nav {
      margin-top: 56px;
      padding-top: 40px;
      border-top: 1px solid var(--border);
      width: 100%;
      max-width: 560px;
    }

    .err-nav-title {
      font-size: 11px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 20px;
    }

    .err-nav-links {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
    }

    .err-nav-link {
      display: inline-block;
      padding: 8px 18px;
      font-size: 13px;
      color: var(--text);
      text-decoration: none;
      border: 1px solid var(--border);
      border-radius: 2px;
      transition: border-color 0.18s, color 0.18s;
    }

    .err-nav-link:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    /* ── Footer ── */
    .err-footer {
      padding: 20px 40px;
      border-top: 1px solid var(--border);
      text-align: center;
      font-size: 12px;
      color: var(--muted);
    }

    @media (max-width: 480px) {
      .err-header { padding: 20px 24px; }
      .err-footer { padding: 16px 24px; }
    }
  </style>
</head>
<body>
  <header class="err-header">
    <a class="err-logo" href="/" aria-label="Loft Line — მთავარი გვერდი">Loft Line</a>
  </header>

  <main class="err-main" role="main">
    <div class="err-code" aria-hidden="true">404</div>
    <h1 class="err-title" id="main-heading">გვერდი არ მოიძებნა</h1>
    <p class="err-desc">
      მოთხოვნილი გვერდი წაშლილია, გადატანილია ან არასდროს არსებობდა.
      სცადეთ ძიება ან დაბრუნდით მთავარ გვერდზე.
    </p>
    <div class="err-actions">
      <a href="/" class="err-btn err-btn--primary">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        მთავარი გვერდი
      </a>
      <button onclick="history.back()" class="err-btn err-btn--ghost">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg>
        უკან დაბრუნება
      </button>
    </div>

    <nav class="err-nav" aria-label="კატეგორიების ნავიგაცია">
      <p class="err-nav-title">კატეგორიები</p>
      <div class="err-nav-links">
        <a href="/main-furniture.html" class="err-nav-link">მთავარი ავეჯი</a>
        <a href="/office-furniture.html" class="err-nav-link">საოფისე ავეჯი</a>
        <a href="/loft-collection.html" class="err-nav-link">ლითონის ნაკეთობა</a>
        <a href="/lighting.html" class="err-nav-link">განათება</a>
        <a href="/decoration.html" class="err-nav-link">დეკორაცია</a>
      </div>
    </nav>
  </main>

  <footer class="err-footer">
    <p>&copy; <span id="errYear"></span> Loft Line. ყველა უფლება დაცულია.</p>
  </footer>

  <script>
    document.getElementById('errYear').textContent = new Date().getFullYear();
  </script>
</body>
</html>
